services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: cyberquest/api:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET_obrigatorio}"
      LAB_FLAG_SECRET: "${LAB_FLAG_SECRET:?LAB_FLAG_SECRET_obrigatorio}"
      DATABASE_PATH: /app/data/cyberquest.db
      MAX_CONCURRENT_LABS: "${MAX_CONCURRENT_LABS:-3}"
      LAB_DEFAULT_TTL_MINUTES: "${LAB_DEFAULT_TTL_MINUTES:-60}"
      DOCKER_SOCKET: /var/run/docker.sock
      CONTENT_DIR: /app/content
      LABS_DIR: /app/labs
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "4000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const s=net.connect(4000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: cyberquest/web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  labs-attacker:
    profiles: ["labs-build"]
    image: cyberquest/attacker:latest
    build:
      context: ./labs/images/attacker
    command: ["/bin/true"]
    restart: "no"

  labs-target:
    profiles: ["labs-build"]
    image: cyberquest/target:latest
    build:
      context: ./labs/images/target
    command: ["/bin/true"]
    restart: "no"

  labs-proxy:
    profiles: ["labs-build"]
    image: cyberquest/proxy:latest
    build:
      context: ./labs/images/proxy
    command: ["/bin/true"]
    restart: "no"
